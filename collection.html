<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Collection | Tesoro</title>
  <meta name="description" content="Luxury outdoor seating, tables and sets, handmade to order in Los Angeles.">
  <link rel="preload" href="assets/fonts/jost-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/hanken-grotesk-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div data-site-header></div>

  <main id="content" tabindex="-1">
    <section class="page-head">
      <div class="container page-head__inner">
        <div>
          <p class="eyebrow">The collection</p>
          <h1 data-title>Collection</h1>
        </div>
        <p data-blurb></p>
      </div>
    </section>

    <div class="container">
      <nav class="filters" aria-label="Collections">
        <div class="filters__inner">
          <span data-filters style="display:contents"></span>
          <span class="filters__count" data-count aria-live="polite"></span>
        </div>
      </nav>
      <div class="product-grid" data-grid></div>
    </div>

    <section class="cta-band" style="margin-top:clamp(72px,10vw,140px)" id="inquire">
      <div class="container cta-band__inner">
        <h2>Not sure which piece is right for your space?</h2>
        <div class="cta-band__actions">
          <a class="btn" href="#inquire" data-open-quote>Request a quote</a>
          <a class="btn btn--ghost" href="samples.html">Order samples</a>
        </div>
      </div>
    </section>
  </main>

  <div data-site-footer></div>

  <script src="js/site.js"></script>
  <script src="js/collection.js"></script>
</body>
</html>
