<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Tesoro</title>
  <meta name="description" content="Contact the Tesoro studio in Los Angeles, or your nearest representative in Los Angeles, Toronto, Chicago or Miami.">
  <link rel="preload" href="assets/fonts/jost-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/hanken-grotesk-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div data-site-header></div>

  <main id="content" tabindex="-1">
    <section class="page-head">
      <div class="container page-head__inner">
        <div>
          <p class="eyebrow">Contact</p>
          <h1>Speak with us.</h1>
        </div>
        <p>Reach the studio directly, or your nearest representative. Every piece is made to order, so a conversation is the best place to start.</p>
      </div>
    </section>

    <section class="section" style="padding-top:0" aria-label="Studio and message form">
      <div class="container two-col">
        <div class="studio" data-studio></div>

        <div class="form-card">
          <div data-form-wrap>
            <h2>Send us a message</h2>
            <form data-form novalidate>
              <div class="field">
                <label for="c-region">Your region</label>
                <select id="c-region" name="region" required>
                  <option value="">Select the nearest region</option>
                </select>
              </div>
              <div class="rep-card" data-rep-card hidden></div>
              <div class="field-row">
                <div class="field"><label for="c-name">Name</label><input id="c-name" name="name" autocomplete="name" required></div>
                <div class="field"><label for="c-phone">Phone</label><input id="c-phone" name="phone" type="tel" autocomplete="tel"></div>
              </div>
              <div class="field"><label for="c-email">Email</label><input id="c-email" name="email" type="email" autocomplete="email" required></div>
              <div class="field"><label for="c-msg">How can we help?</label><textarea id="c-msg" name="message" required placeholder="Which pieces you are considering, quantities, timeline, or anything else we should know"></textarea></div>
              <button class="btn btn--block" type="submit">Send message</button>
              <p class="form-note">Mockup: this form does not send anything yet.</p>
            </form>
          </div>
          <div class="form-sent" data-sent tabindex="-1" hidden></div>
        </div>
      </div>
    </section>

    <section class="section" style="padding-top:0" aria-labelledby="reps-title">
      <div class="container">
        <div class="section-head">
          <div>
            <p class="eyebrow">Representatives</p>
            <h2 id="reps-title">Your nearest representative</h2>
          </div>
        </div>
        <div class="reps" data-reps></div>
        <div class="general" data-general></div>
      </div>
    </section>
  </main>

  <div data-site-footer></div>

  <script src="js/site.js"></script>
  <script src="js/contact.js"></script>
</body>
</html>
